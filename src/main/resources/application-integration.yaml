spring:
  config:
    activate:
      on-profile: integration
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/story_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:story_user}
    password: ${DB_PASSWORD:story_pass}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${STORY_KAFKA_CONSUMER_ENABLED:false}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8089}

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

story:
  gateway-auth:
    enabled: true
  kafka:
    consumer-enabled: ${STORY_KAFKA_CONSUMER_ENABLED:false}
  outbox:
    enabled: ${STORY_OUTBOX_ENABLED:false}
  openai:
    enabled: ${STORY_OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
  schedule:
    ownership-check-enabled: ${STORY_SCHEDULE_OWNERSHIP_CHECK_ENABLED:false}
    base-url: ${SCHEDULE_SERVICE_URL:http://localhost:8081}
  detail-screen:
    member:
      query-enabled: true
      base-url: ${MEMBER_SERVICE_URL:http://localhost:8082}
      profile-path: /api/v1/members/{memberUuid}/profile
    follow:
      query-enabled: false
      base-url: ${FOLLOW_SERVICE_URL:http://localhost:8082}
    schedule:
      query-enabled: true
      base-url: ${SCHEDULE_SERVICE_URL:http://localhost:8081}
      detail-path: /api/v1/schedules/{scheduleUuid}
    like:
      query-enabled: true
      base-url: ${LIKE_SERVICE_URL:http://localhost:8091}
      status-path: /api/v1/likes/STORY/{storyUuid}/me
    comment:
      query-enabled: true
      base-url: ${COMMENT_SERVICE_URL:http://localhost:8090}
      list-path: /api/planwith-fo-comment/stories/{storyUuid}/comments
  feed:
    member-query-enabled: true
    member-base-url: ${MEMBER_SERVICE_URL:http://localhost:8082}
    membership-query-enabled: true
    membership-base-url: ${MEMBERSHIP_SERVICE_URL:http://localhost:8087}
  search:
    member-query-enabled: true
    member-base-url: ${MEMBER_SERVICE_URL:http://localhost:8082}
