spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/story_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${STORY_KAFKA_CONSUMER_ENABLED:false}

server:
  port: ${SERVER_PORT:8089}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  gateway:
    public-url: /

story:
  kafka:
    consumer-enabled: ${STORY_KAFKA_CONSUMER_ENABLED:false}
  outbox:
    enabled: ${STORY_OUTBOX_ENABLED:false}
  openai:
    enabled: ${STORY_OPENAI_ENABLED:false}
    # 환경변수를 사용하지 않을 때는 아래 기본값 자리에 로컬 키를 입력한다: ${OPENAI_API_KEY:여기에_키_입력}
    api-key: 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
  schedule:
    ownership-check-enabled: false
  detail-screen:
    member:
      query-enabled: false
    follow:
      query-enabled: false
    schedule:
      query-enabled: false
    like:
      query-enabled: false
    comment:
      query-enabled: false
  feed:
    member-query-enabled: false
    membership-query-enabled: false
  search:
    member-query-enabled: false

