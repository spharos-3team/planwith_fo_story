spring:
  application:
    name: planwith-fo-story
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:story-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      auto-startup: ${STORY_KAFKA_CONSUMER_ENABLED:false}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:0}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    serviceUrl:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://discovery:8761/eureka/}"
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    kafka:
      enabled: false
    redis:
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

app:
  gateway:
    public-url: ${GATEWAY_PUBLIC_URL:/}
  auth:
    id: ${LOGIN_ID:test-001}
    pw: ${LOGIN_PASSWORD:1234}
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-story-deploy-v1}

story:
  gateway-auth:
    enabled: ${STORY_GATEWAY_AUTH_ENABLED:true}
  kafka:
    consumer-enabled: ${STORY_KAFKA_CONSUMER_ENABLED:false}
    topics:
      member-profile-changed: ${STORY_TOPIC_MEMBER_PROFILE_CHANGED:planwith.member.profile-changed}
      like-created: ${STORY_TOPIC_LIKE_CREATED:planwith.like.created}
      like-removed: ${STORY_TOPIC_LIKE_REMOVED:planwith.like.removed}
      comment-created: ${STORY_TOPIC_COMMENT_CREATED:planwith.comment.created}
      comment-removed: ${STORY_TOPIC_COMMENT_REMOVED:planwith.comment.removed}
      membership-subscribed: ${STORY_TOPIC_MEMBERSHIP_SUBSCRIBED:planwith.membership.subscribed}
      membership-canceled: ${STORY_TOPIC_MEMBERSHIP_CANCELED:planwith.membership.canceled}
      story-created: ${STORY_TOPIC_STORY_CREATED:planwith.story.created}
      story-updated: ${STORY_TOPIC_STORY_UPDATED:planwith.story.updated}
      story-deleted: ${STORY_TOPIC_STORY_DELETED:planwith.story.deleted}
      token-usage: ${STORY_TOPIC_TOKEN_USAGE:planwith.token.usage}
  outbox:
    enabled: ${STORY_OUTBOX_ENABLED:false}
    relay-batch-size: ${STORY_OUTBOX_RELAY_BATCH_SIZE:50}
    relay-interval: ${STORY_OUTBOX_RELAY_INTERVAL:5s}
    relay-initial-delay: ${STORY_OUTBOX_RELAY_INITIAL_DELAY:5s}
    send-timeout: ${STORY_OUTBOX_SEND_TIMEOUT:10s}
    max-retry: ${STORY_OUTBOX_MAX_RETRY:10}
    backoff-initial: ${STORY_OUTBOX_BACKOFF_INITIAL:5s}
    backoff-multiplier: ${STORY_OUTBOX_BACKOFF_MULTIPLIER:2}
    backoff-max: ${STORY_OUTBOX_BACKOFF_MAX:5m}
  openai:
    enabled: ${STORY_OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODERATION_MODEL:omni-moderation-latest}
    moderation-path: ${OPENAI_MODERATION_PATH:/v1/moderations}
  schedule:
    ownership-check-enabled: ${STORY_SCHEDULE_OWNERSHIP_CHECK_ENABLED:false}
    base-url: ${SCHEDULE_SERVICE_URL:}
    ownership-path: ${STORY_SCHEDULE_OWNERSHIP_PATH:/api/schedules/{scheduleUuid}/owners/{memberUuid}}
  detail-screen:
    member:
      query-enabled: ${STORY_DETAIL_SCREEN_MEMBER_QUERY_ENABLED:false}
      base-url: ${MEMBER_SERVICE_URL:}
      profile-path: ${STORY_DETAIL_SCREEN_MEMBER_PROFILE_PATH:/api/members/{memberUuid}/profile}
    follow:
      query-enabled: ${STORY_DETAIL_SCREEN_FOLLOW_QUERY_ENABLED:false}
      base-url: ${FOLLOW_SERVICE_URL:}
      summary-path: ${STORY_DETAIL_SCREEN_FOLLOW_SUMMARY_PATH:/api/members/{memberUuid}/follow-summary}
    schedule:
      query-enabled: ${STORY_DETAIL_SCREEN_SCHEDULE_QUERY_ENABLED:false}
      base-url: ${SCHEDULE_SERVICE_URL:}
      detail-path: ${STORY_DETAIL_SCREEN_SCHEDULE_DETAIL_PATH:/api/schedules/{scheduleUuid}}
    like:
      query-enabled: ${STORY_DETAIL_SCREEN_LIKE_QUERY_ENABLED:false}
      base-url: ${LIKE_SERVICE_URL:}
      status-path: ${STORY_DETAIL_SCREEN_LIKE_STATUS_PATH:/api/stories/{storyUuid}/likes/me}
    comment:
      query-enabled: ${STORY_DETAIL_SCREEN_COMMENT_QUERY_ENABLED:false}
      base-url: ${COMMENT_SERVICE_URL:}
      list-path: ${STORY_DETAIL_SCREEN_COMMENT_LIST_PATH:/api/stories/{storyUuid}/comments}
  feed:
    member-query-enabled: ${STORY_FEED_MEMBER_QUERY_ENABLED:false}
    member-base-url: ${MEMBER_SERVICE_URL:}
    followings-path: ${STORY_FEED_FOLLOWINGS_PATH:/api/v1/members/{memberUuid}/followings}
    members-path: ${STORY_FEED_MEMBERS_PATH:/api/v1/members/search}
    membership-query-enabled: ${STORY_FEED_MEMBERSHIP_QUERY_ENABLED:false}
    membership-base-url: ${MEMBERSHIP_SERVICE_URL:}
    joined-memberships-path: ${STORY_FEED_JOINED_MEMBERSHIPS_PATH:/api/planwith-fo-membership/memberships/me/subscriptions}
    eligible-grades: ${STORY_FEED_ELIGIBLE_GRADES:ADVENTURE,PLANWITH}
  search:
    member-query-enabled: ${STORY_SEARCH_MEMBER_QUERY_ENABLED:false}
    member-base-url: ${MEMBER_SERVICE_URL:}
    member-search-path: ${STORY_SEARCH_MEMBER_PATH:/api/v1/members/search}
  cache:
    key-prefix: ${STORY_CACHE_KEY_PREFIX:story}
    detail-namespace: ${STORY_CACHE_DETAIL_NAMESPACE:detail}
    popular-namespace: ${STORY_CACHE_POPULAR_NAMESPACE:popular}
    feed-namespace: ${STORY_CACHE_FEED_NAMESPACE:feed}
    ttl: ${STORY_CACHE_TTL:10m}
